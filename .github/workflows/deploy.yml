name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy, but never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc --noEmit. Note tsconfig is not strict, so this catches shape
      # errors but not nullability.
      - run: npm run lint

      - run: npm run build

      # Pages itself must be switched on once by a repo admin (Settings →
      # Pages → Source: GitHub Actions, or POST /repos/:o/:r/pages with
      # build_type=workflow). The workflow's own GITHUB_TOKEN cannot do it:
      # creating a Pages site returns "Resource not accessible by
      # integration". enablement:true is kept for forks whose token can.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
